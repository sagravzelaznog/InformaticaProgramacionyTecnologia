<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Final: Informática y Diseño Digital</title>
    <style>
        /* Variables de Gamificación - Tonos Tecnológicos e Inteligencia */
        :root {
            --primary-bg: #f4f5f7;
            --header-bg: #512DA8; /* Deep Purple Canva - Concentración */
            --text-main: #1f2937;
            --text-light: #ffffff;
            --q-bg: #ffffff;
            /* Colores tipo Kahoot */
            --opt-a: #e21b3c;
            --opt-b: #1368ce;
            --opt-c: #d89e00;
            --opt-d: #26890c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- ENCABEZADO WEB --- */
        header {
            background: linear-gradient(135deg, var(--header-bg) 0%, #00C4CC 100%);
            color: var(--text-light);
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        h1 { font-size: 2.2rem; margin-bottom: 15px; font-weight: 800; }

        /* --- CAMPOS DE IDENTIFICACIÓN (OBLIGATORIOS) --- */
        .student-info {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .info-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-group label {
            font-weight: 700;
            font-size: 1.05rem;
            white-space: nowrap;
        }

        .info-group input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--text-light);
            color: var(--text-light);
            font-size: 1.05rem;
            padding: 4px;
            outline: none;
            transition: border-color 0.3s;
        }

        .info-group input:focus { border-bottom-color: #FFC933; }
        .info-group input::placeholder { color: rgba(255,255,255,0.6); font-size: 0.9rem; }

        /* --- TARJETAS DE PREGUNTAS WEB --- */
        .question-card {
            background-color: var(--q-bg);
            padding: 22px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-left: 6px solid var(--header-bg);
            transition: opacity 0.3s, filter 0.3s;
        }

        /* Bloqueo visual post-respuesta */
        .question-card.locked {
            opacity: 0.85;
            border-left-color: #9CA3AF;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        /* --- CUADRÍCULA DE OPCIONES (KAHOOT STYLE) --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 14px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            box-shadow: 0 3px 0 rgba(0,0,0,0.2);
        }

        .option-label:hover:not(.disabled) {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .option-label:active:not(.disabled) {
            transform: translateY(2px);
            box-shadow: none;
        }

        .option-label.disabled {
            cursor: not-allowed;
            opacity: 0.4;
            box-shadow: none;
            transform: none;
        }

        .option-label input[type="radio"] {
            margin-right: 12px;
            transform: scale(1.4);
            cursor: inherit;
        }

        .opt-0 { background-color: var(--opt-a); }
        .opt-1 { background-color: var(--opt-b); }
        .opt-2 { background-color: var(--opt-c); }
        .opt-3 { background-color: var(--opt-d); }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 1.3rem;
            font-weight: 800;
            background-color: var(--header-bg);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .submit-btn:hover { background-color: #311B92; }

        #result-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #D1FAE5;
            color: #065F46;
            border-radius: 8px;
            font-size: 1.4rem;
            text-align: center;
            font-weight: 800;
            display: none;
        }

        .footer-text {
            text-align: center; margin-top: 40px; color: #6B7280; font-size: 0.85rem; font-weight: bold;
        }

        /* =========================================================
           SÚPER COMPRESIÓN PARA PDF (MÁXIMO 2 HOJAS - SIN BORDES)
           ========================================================= */
        @media print {
            @page { size: letter; margin: 0.8cm; }
            body { 
                background-color: white; color: black; 
                font-size: 9pt; line-height: 1.1; 
            }
            .container { width: 100%; max-width: none; padding: 0; }
            
            /* Encabezado puramente textual */
            header { 
                background: white !important; color: black !important; 
                box-shadow: none; border-radius: 0; padding: 0; 
                margin-bottom: 8px; text-align: left;
            }
            h1 { font-size: 12pt; margin-bottom: 5px; border-bottom: 1px solid black; padding-bottom: 3px; }
            
            /* Identificación en línea */
            .student-info { background: none; padding: 0; border: none; gap: 8px; margin-bottom: 8px; flex-wrap: nowrap;}
            .info-group label { color: black; font-size: 9pt; font-weight: bold;}
            .info-group input { border: none; border-bottom: 1px solid black; color: black; font-size: 9pt; padding: 0; }
            .info-group input::placeholder { color: transparent; }
            
            /* Preguntas sin cajas, hiper-comprimidas */
            .question-card { 
                box-shadow: none; border: none; border-bottom: 1px dashed #aaa; 
                border-left: none; padding: 4px 0; margin-bottom: 2px; 
                page-break-inside: avoid; break-inside: avoid; 
                opacity: 1 !important; filter: none !important;
            }
            .question-text { font-size: 9.5pt; margin-bottom: 3px; font-weight: bold; }
            
            /* Opciones sin color de fondo */
            .options-grid { grid-template-columns: 1fr 1fr; gap: 1px; }
            .option-label { 
                background: transparent !important; color: black !important; 
                border: none; box-shadow: none; padding: 1px 0; 
                font-size: 9pt; font-weight: normal; opacity: 1 !important;
            }
            .option-label input[type="radio"] { transform: scale(0.85); margin-right: 4px; }

            .submit-btn, #result-container { display: none !important; }
            .footer-text { position: fixed; bottom: 0; width: 100%; border-top: 1px solid #ccc; padding-top: 2px; font-size: 7pt; }
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .student-info { flex-direction: column; }
            .info-group { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Evaluación U1: Ecosistema Canva y Diseño Digital</h1>
        <div class="student-info">
            <div class="info-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Obligatorio" autocomplete="off">
            </div>
            <div class="info-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Obligatorio" autocomplete="off">
            </div>
            <div class="info-group">
                <label for="semestre">Semestre:</label>
                <input type="text" id="semestre" name="semestre" autocomplete="off">
            </div>
            <div class="info-group">
                <label for="fecha">Fecha:</label>
                <input type="text" id="fecha" name="fecha" autocomplete="off">
            </div>
        </div>
    </header>

    <form id="quiz-form">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" onclick="calificarExamen()">Entregar Evaluación</button>
        <div id="result-container"></div>
    </form>
    
    <div class="footer-text">
        &copy; 2026 JMGV-PTEL Programa de INFORMÁTICA. Todos los derechos reservados.
    </div>
</div>

<script>
    /* Banco de preguntas extraído de las Masterclasses de Canva (Sesiones 01 a 09) */
    const quizData = [
        { 
            question: "1. ¿Qué significa que la interfaz de Canva esté basada en un sistema 'Drag & Drop'?", 
            options: ["Que funciona mediante el sistema de 'Arrastrar y Soltar' elementos", "Que requiere instalar un programa pesado", "Que se basa en copiar y pegar código HTML", "Que solo funciona en dispositivos móviles"], 
            correct: 0 
        },
        { 
            question: "2. Desde el punto de vista de la psicología de la tipografía, ¿qué transmite generalmente una fuente 'Sans Serif' (palo seco)?", 
            options: ["Elegancia y tradición clásica", "Modernidad, limpieza y tecnología", "Desorden visual y caos", "Misterio y terror"], 
            correct: 1 
        },
        { 
            question: "3. ¿Qué sucede automáticamente si arrastras una fotografía desde tus 'Subidos' directamente sobre un 'Marco' (Frame)?", 
            options: ["La foto se elimina del servidor", "La foto se recorta tomando la forma exacta del marco", "La imagen se convierte a blanco y negro", "Aparece un error de capa bloqueada"], 
            correct: 1 
        },
        { 
            question: "4. En la psicología del color, si diseñas un gráfico para una institución bancaria o médica, ¿qué suele comunicar el color AZUL?", 
            options: ["Urgencia y agresividad", "Diversión y hambre", "Confianza, seriedad y calma", "Lujo, poder y exclusividad"], 
            correct: 2 
        },
        { 
            question: "5. ¿Cuál es el atajo de teclado estándar utilizado para 'Agrupar' múltiples elementos seleccionados en el lienzo de diseño?", 
            options: ["Alt + F4", "Ctrl + G (o Cmd + G)", "Shift + Del", "Ctrl + Z"], 
            correct: 1 
        },
        { 
            question: "6. Psicológicamente y andragógicamente, ¿cuál es el objetivo principal de animar elementos (como el efecto Pop) en una presentación educativa?", 
            options: ["Hacer que el diseño se vea como una película de acción", "Guiar la atención del alumno y evitar la sobrecarga cognitiva", "Ocultar errores ortográficos en los párrafos", "Reducir el tamaño del archivo final"], 
            correct: 1 
        },
        { 
            question: "7. Al insertar un elemento de 'Gráfico' (Chart) dinámico en Canva, ¿cómo modificas los valores matemáticos que se muestran?", 
            options: ["Dibujando y estirando rectángulos manualmente con el mouse", "Editando los datos en la pequeña hoja de cálculo integrada que aparece en el panel", "Escribiendo fórmulas complejas en código HTML", "No se pueden modificar, los gráficos en Canva son imágenes estáticas"], 
            correct: 1 
        },
        { 
            question: "8. Al trabajar en la Línea de Tiempo de video, ¿para qué sirve específicamente la herramienta 'Dividir página' (Split)?", 
            options: ["Para silenciar la pista de audio principal", "Para cortar un clip de video en dos partes independientes", "Para duplicar el lienzo completo", "Para añadir una transición de cortinilla"], 
            correct: 1 
        },
        { 
            question: "9. Pedagógicamente, ¿por qué NO deberías llenar una diapositiva con párrafos de texto largos y densos?", 
            options: ["Porque divide la atención del público (no pueden leer detenidamente y escucharte a la vez)", "Porque la Inteligencia Artificial no es capaz de procesarlos", "Porque consume más recursos de internet", "Porque Canva impone un límite de palabras por diseño"], 
            correct: 0 
        },
        { 
            question: "10. ¿Cuál es la función de la herramienta 'Diseño Mágico' (Magic Design) impulsada por IA en la sección de presentaciones?", 
            options: ["Borra fondos complejos de las fotografías con un solo clic", "Traduce documentos completos a cualquier idioma", "Crea una presentación inicial completa (texto, imágenes y layout) a partir de un breve prompt descriptivo", "Renderiza gráficos en 3D para impresión"], 
            correct: 2 
        }
    ];

    // Aleatoriedad de Opciones (Anti-Copia)
    quizData.forEach((q) => {
        let optionsWithIndex = q.options.map((opt, index) => {
            return { text: opt, isCorrect: (index === q.correct) };
        });

        // Fisher-Yates
        for (let i = optionsWithIndex.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
        }

        q.options = optionsWithIndex.map(opt => opt.text);
        q.correct = optionsWithIndex.findIndex(opt => opt.isCorrect);
    });

    const container = document.getElementById('questions-container');

    // Renderizar HTML dinámicamente
    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${index}`;
        
        let optionsHTML = '';
        q.options.forEach((opt, i) => {
            optionsHTML += `
                <label class="option-label opt-${i}">
                    <input type="radio" name="q${index}" value="${i}" onclick="validarYBloquear(event, ${index})">
                    <span>${opt}</span>
                </label>
            `;
        });

        card.innerHTML = `
            <div class="question-text">${q.question}</div>
            <div class="options-grid">
                ${optionsHTML}
            </div>
        `;
        container.appendChild(card);
    });

    // LÓGICA PRINCIPAL: Validación de Nombre + Bloqueo de Respuesta
    function validarYBloquear(event, questionIndex) {
        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();

        // 1. OBLIGATORIO: Validar Identidad
        if (nombre === "" || apellido === "") {
            event.preventDefault(); // Rechaza el clic físicamente
            alert("⚠️ ACCIÓN REQUERIDA: Debes ingresar tu Nombre y Apellido completos en el encabezado antes de poder responder.");
            
            // Foco en el campo vacío
            if (nombre === "") document.getElementById('nombre').focus();
            else document.getElementById('apellido').focus();
            return;
        }

        // 2. BLOQUEO: Desactivar las demás opciones de esta pregunta
        const radioSeleccionado = event.target;
        const nombreGrupo = radioSeleccionado.name;
        const todosLosRadios = document.querySelectorAll(`input[name="${nombreGrupo}"]`);
        
        todosLosRadios.forEach(radio => {
            if (radio !== radioSeleccionado) {
                radio.disabled = true; 
                radio.closest('.option-label').classList.add('disabled');
            }
        });

        // Efecto visual de que la pregunta ya fue respondida
        document.getElementById(`card-${questionIndex}`).classList.add('locked');
    }

    // Lógica final de Calificación
    function calificarExamen() {
        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();
        
        if (nombre === "" || apellido === "") {
            alert("Error: Asegúrate de ingresar tu Nombre y Apellido.");
            return;
        }

        let score = 0;
        let allAnswered = true;

        quizData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected) {
                if (parseInt(selected.value) === q.correct) {
                    score++;
                }
            } else {
                allAnswered = false;
            }
        });

        const resultDiv = document.getElementById('result-container');
        resultDiv.style.display = 'block';

        if (!allAnswered) {
            resultDiv.style.backgroundColor = '#FEF3C7'; // Amarillo alerta
            resultDiv.style.color = '#92400E';
            resultDiv.innerHTML = 'Aún tienes preguntas sin responder. Revisa el examen completo.';
            return;
        }

        const percentage = Math.round((score / quizData.length) * 100);
        resultDiv.style.backgroundColor = score >= 6 ? '#D1FAE5' : '#FEE2E2';
        resultDiv.style.color = score >= 6 ? '#065F46' : '#991B1B';
        resultDiv.innerHTML = `Evaluación de: ${nombre} ${apellido}<br>Aciertos: ${score} de 10 (${percentage}%)`;
        
        // Bloquear botón para evitar spam
        document.querySelector('.submit-btn').disabled = true;
    }
</script>

</body>
</html>
