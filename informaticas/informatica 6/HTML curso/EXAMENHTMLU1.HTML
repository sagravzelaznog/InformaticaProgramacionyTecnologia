<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen: Fundamentos de HTML</title>
    <style>
        /* Variables de color gamificadas y orientadas a Informática */
        :root {
            --primary-bg: #f0f4f8;
            --header-bg: #00838f; /* Cian Tecnológico: claridad y enfoque */
            --text-main: #2c3e50;
            --text-light: #ffffff;
            --q-bg: #ffffff;
            --opt-a: #e21b3c;
            --opt-b: #1368ce;
            --opt-c: #d89e00;
            --opt-d: #26890c;
            --locked-bg: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Encabezado */
        header {
            background-color: var(--header-bg);
            color: var(--text-light);
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        /* Campos de identificación - Requiere Nombre y Apellido */
        .student-info {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            border-radius: 8px;
        }

        .info-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-group label {
            font-weight: bold;
            font-size: 1.1rem;
            white-space: nowrap;
        }

        .info-group input {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--text-light);
            color: var(--text-light);
            font-size: 1.1rem;
            padding: 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        .info-group input:focus {
            border-bottom-color: #ffd54f;
        }

        .info-group input::placeholder {
            color: rgba(255,255,255,0.6);
            font-size: 0.9rem;
        }

        /* Diseño de Preguntas */
        .question-card {
            background-color: var(--q-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 6px solid var(--header-bg);
            transition: opacity 0.3s;
        }

        /* Estilo visual cuando la pregunta está bloqueada */
        .question-card.locked {
            opacity: 0.85;
            border-left-color: #7f8c8d;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* Cuadrícula de opciones */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s, opacity 0.3s;
        }

        .option-label:hover:not(.disabled) {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .option-label.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-label input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.5);
            cursor: inherit;
        }

        .opt-0 { background-color: var(--opt-a); }
        .opt-1 { background-color: var(--opt-b); }
        .opt-2 { background-color: var(--opt-c); }
        .opt-3 { background-color: var(--opt-d); }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            background-color: var(--header-bg);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
        }

        .submit-btn:hover { background-color: #005662; }

        #result-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #d4edda;
            color: #155724;
            border-radius: 8px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .footer-text {
            text-align: center;
            margin-top: 40px;
            color: #666;
            font-size: 0.9rem;
            font-weight: bold;
        }

        /* =========================================================
           COMPRESIÓN EXTREMA PARA IMPRESIÓN (MÁXIMO 2 HOJAS)
           ========================================================= */
        @media print {
            @page { 
                size: letter; 
                margin: 0.8cm; /* Margen ultrarreducido */
            }
            body { 
                background-color: white; 
                color: black; 
                font-size: 9.5pt; /* Tipografía más pequeña para ahorrar espacio */
                line-height: 1.1; 
            }
            .container { width: 100%; max-width: none; padding: 0; }
            
            header { 
                background-color: white !important; 
                color: black !important; 
                box-shadow: none; 
                border-radius: 0; 
                padding: 0; 
                margin-bottom: 8px; 
                text-align: left;
            }
            h1 { font-size: 13pt; margin-bottom: 5px; border-bottom: 2px solid black; padding-bottom: 3px; }
            
            /* Inputs limpios y compactos para imprimir */
            .student-info { background: none; padding: 0; gap: 8px; margin-bottom: 10px; flex-wrap: nowrap;}
            .info-group label { color: black; font-size: 9.5pt; font-weight: bold;}
            .info-group input { border: none; border-bottom: 1px solid black; color: black; font-size: 9.5pt; padding: 0; }
            .info-group input::placeholder { color: transparent; }
            
            /* Eliminación de bordes decorativos */
            .question-card { 
                box-shadow: none; 
                border: none; 
                border-bottom: 1px dashed #bbb; /* Separador muy fino */
                border-left: none; 
                padding: 4px 0; 
                margin-bottom: 4px; 
                page-break-inside: avoid; 
                break-inside: avoid; 
            }
            
            .question-text { font-size: 10pt; margin-bottom: 3px; font-weight: bold; }
            
            /* Opciones compactas sin colores */
            .options-grid { grid-template-columns: 1fr 1fr; gap: 2px; }
            .option-label { 
                background-color: transparent !important; 
                color: black !important; 
                border: none; 
                padding: 1px 0; 
                font-size: 9.5pt;
                font-weight: normal;
                opacity: 1 !important; /* Ignora estilos web de bloqueo */
            }
            .option-label input[type="radio"] {
                transform: scale(0.85); 
                margin-right: 4px;
            }

            .submit-btn, #result-container { display: none !important; }
            
            .footer-text { 
                position: fixed; 
                bottom: 0; 
                width: 100%; 
                border-top: 1px solid #ccc; 
                padding-top: 2px; 
                font-size: 7.5pt;
            }
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .student-info { flex-direction: column; }
            .info-group { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Examen de Informática: Lenguaje HTML y Etiquetas</h1>
        <div class="student-info">
            <div class="info-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" autocomplete="off">
            </div>
            <div class="info-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Ingresa tu apellido" autocomplete="off">
            </div>
            <div class="info-group">
                <label for="semestre">Semestre:</label>
                <input type="text" id="semestre" name="semestre" autocomplete="off">
            </div>
            <div class="info-group">
                <label for="fecha">Fecha:</label>
                <input type="text" id="fecha" name="fecha" autocomplete="off">
            </div>
        </div>
    </header>

    <form id="quiz-form">
        <div id="questions-container"></div>
        <button type="button" class="submit-btn" onclick="calificarExamen()">Finalizar y Calificar</button>
        <div id="result-container"></div>
    </form>
    
    <div class="footer-text">
        &copy; 2026 JMGV-PTEL Programa de INFORMÁTICA. Todos los derechos reservados.
    </div>
</div>

<script>
    // Banco de Preguntas sobre HTML
    const quizData = [
        { question: "1. ¿Qué significa exactamente el acrónimo HTML en el desarrollo web?", options: ["HyperText Markup Language", "HyperLinks and Text Markup Language", "Home Tool Markup Language", "HyperText Machine Language"], correct: 0 },
        { question: "2. ¿Cuál es la etiqueta raíz obligatoria que debe envolver todo el contenido de un documento HTML5?", options: ["&lt;html&gt;", "&lt;head&gt;", "&lt;body&gt;", "&lt;root&gt;"], correct: 0 },
        { question: "3. ¿Qué etiqueta se utiliza para definir el título de la página web, el cual aparece en la pestaña del navegador?", options: ["&lt;title&gt;", "&lt;meta&gt;", "&lt;header&gt;", "&lt;h1&gt;"], correct: 0 },
        { question: "4. De las siguientes opciones, ¿cuál etiqueta define el encabezado de mayor jerarquía visual y semántica?", options: ["&lt;h1&gt;", "&lt;heading&gt;", "&lt;h6&gt;", "&lt;head&gt;"], correct: 0 },
        { question: "5. ¿Qué etiqueta se emplea para crear un hipervínculo o enlace hacia otra página web?", options: ["&lt;a&gt;", "&lt;link&gt;", "&lt;href&gt;", "&lt;nav&gt;"], correct: 0 },
        { question: "6. ¿Cuál es la etiqueta correcta y semántica para insertar una imagen en una página web?", options: ["&lt;img&gt;", "&lt;image&gt;", "&lt;pic&gt;", "&lt;src&gt;"], correct: 0 },
        { question: "7. Si deseas crear una lista ordenada (numerada automáticamente), ¿qué etiqueta contenedora debes utilizar?", options: ["&lt;ol&gt;", "&lt;ul&gt;", "&lt;li&gt;", "&lt;list&gt;"], correct: 0 },
        { question: "8. Para definir un bloque de texto que funciona como un párrafo, ¿qué etiqueta empleamos?", options: ["&lt;p&gt;", "&lt;paragraph&gt;", "&lt;text&gt;", "&lt;block&gt;"], correct: 0 },
        { question: "9. ¿Cuál es la etiqueta genérica de bloque más utilizada para agrupar elementos y aplicarles estilos CSS?", options: ["&lt;div&gt;", "&lt;span&gt;", "&lt;section&gt;", "&lt;group&gt;"], correct: 0 },
        { question: "10. ¿Qué etiqueta se utiliza para forzar un salto de línea (enter) dentro de un bloque de texto?", options: ["&lt;br&gt;", "&lt;break&gt;", "&lt;lb&gt;", "&lt;newline&gt;"], correct: 0 }
    ];

    // Aleatoriedad para barajar las opciones
    quizData.forEach((q) => {
        let optionsWithIndex = q.options.map((opt, index) => {
            return { text: opt, isCorrect: (index === q.correct) };
        });

        for (let i = optionsWithIndex.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
        }

        q.options = optionsWithIndex.map(opt => opt.text);
        q.correct = optionsWithIndex.findIndex(opt => opt.isCorrect);
    });

    const container = document.getElementById('questions-container');

    // Renderizar preguntas
    quizData.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${index}`;
        
        let optionsHTML = '';
        q.options.forEach((opt, i) => {
            optionsHTML += `
                <label class="option-label opt-${i}">
                    <input type="radio" name="q${index}" value="${i}" onclick="manejarSeleccion(event, ${index})">
                    <span>${opt}</span>
                </label>
            `;
        });

        card.innerHTML = `
            <div class="question-text">${q.question}</div>
            <div class="options-grid">
                ${optionsHTML}
            </div>
        `;
        container.appendChild(card);
    });

    // Lógica principal: Validar Identidad y Bloquear Preguntas
    function manejarSeleccion(event, questionIndex) {
        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();

        // 1. Validar que tenga Nombre y Apellido
        if (nombre === "" || apellido === "") {
            event.preventDefault(); // Evita que se marque la opción
            alert("⚠️ ALERTA: Es obligatorio ingresar tu Nombre y Apellido en la parte superior antes de poder contestar el examen.");
            
            // Resaltar los campos vacíos
            if(nombre === "") document.getElementById('nombre').focus();
            else document.getElementById('apellido').focus();
            return;
        }

        // 2. Bloquear la pregunta una vez contestada
        const radioSeleccionado = event.target;
        const nombreGrupo = radioSeleccionado.name;
        const todosLosRadios = document.querySelectorAll(`input[name="${nombreGrupo}"]`);
        
        todosLosRadios.forEach(radio => {
            if (radio !== radioSeleccionado) {
                radio.disabled = true; // Deshabilita los inputs no seleccionados
                radio.closest('.option-label').classList.add('disabled'); // Añade clase visual
            }
        });

        // Cambiar el estilo de la tarjeta a "Bloqueado"
        const card = document.getElementById(`card-${questionIndex}`);
        card.classList.add('locked');
    }

    // Lógica de calificación
    function calificarExamen() {
        // Validar identidad antes de calificar
        const nombre = document.getElementById('nombre').value.trim();
        const apellido = document.getElementById('apellido').value.trim();
        
        if (nombre === "" || apellido === "") {
            alert("Debes ingresar tu Nombre y Apellido para poder calificar el examen.");
            return;
        }

        let score = 0;
        let allAnswered = true;

        quizData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected) {
                if (parseInt(selected.value) === q.correct) {
                    score++;
                }
            } else {
                allAnswered = false;
            }
        });

        const resultDiv = document.getElementById('result-container');
        resultDiv.style.display = 'block';

        if (!allAnswered) {
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
            resultDiv.innerHTML = 'Atención: Aún tienes preguntas sin contestar.';
            return;
        }

        const percentage = Math.round((score / quizData.length) * 100);
        resultDiv.style.backgroundColor = score >= 6 ? '#d4edda' : '#f8d7da';
        resultDiv.style.color = score >= 6 ? '#155724' : '#721c24';
        resultDiv.innerHTML = `Examen concluido por ${nombre} ${apellido}.<br>Tu calificación es: ${score} de 10 (${percentage}%)`;
        
        // Deshabilitar el botón de envío para evitar re-calificaciones
        document.querySelector('.submit-btn').disabled = true;
    }
</script>

</body>
</html>
