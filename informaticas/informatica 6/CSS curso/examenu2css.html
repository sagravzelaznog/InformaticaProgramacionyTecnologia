<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen y Problemario: Codificación CSS</title>
    <style>
        /* ================= ESTILOS INTERACTIVOS (KAHOOT STYLE) ================= */
        :root {
            --kahoot-purple: #46178f;
            --red: #e21b3c;
            --blue: #1368ce;
            --yellow: #d89e00;
            --green: #26890c;
            --bg: #f2f2f2;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg); }
        
        #app { max-width: 900px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
        .screen.active { display: flex; }

        /* Login */
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 500px; }
        input { width: 100%; padding: 15px; margin: 15px 0; border: 2px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        .btn-main { background: var(--kahoot-purple); color: white; border: none; padding: 15px 20px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        .btn-secondary { background: var(--blue); color: white; border: none; padding: 15px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; }

        /* Header del Quiz */
        .header { display: flex; justify-content: space-between; width: 100%; padding: 15px 20px; background: white; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; font-weight: bold; font-size: 18px; box-sizing: border-box; }

        /* Pregunta */
        .question-box { background: white; padding: 30px; border-radius: 10px; text-align: center; font-size: 22px; font-weight: bold; margin-bottom: 20px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; }

        /* Botones de Opción */
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        @media (max-width: 600px) { .options-grid { grid-template-columns: 1fr; } }
        
        .option-btn { color: white; border: none; padding: 25px 15px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0px rgba(0,0,0,0.2); transition: transform 0.1s; text-align: center; line-height: 1.2; word-wrap: break-word;}
        .option-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0px 0px rgba(0,0,0,0.2); }
        .option-btn:disabled { cursor: not-allowed; filter: brightness(0.8); }
        
        .opt-0 { background-color: var(--red); }
        .opt-1 { background-color: var(--blue); }
        .opt-2 { background-color: var(--yellow); }
        .opt-3 { background-color: var(--green); }

        /* Pantalla Antitrampas */
        #cheat-warning { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(226, 27, 60, 0.95); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; text-align: center; padding: 20px; box-sizing: border-box; }
        #cheat-warning h1 { font-size: 40px; margin-bottom: 10px; }
        #cheat-warning p { font-size: 22px; font-weight: bold; }

        /* ================= ESTILOS DE IMPRESIÓN (MÁXIMO 1 HOJA PARA 20 PREGUNTAS) ================= */
        #print-area { display: none; }
        
        @media print {
            @page { size: letter; margin: 10mm; } 
            body { background: white; color: black; font-size: 9pt !important; margin: 0; font-family: Arial, sans-serif; }
            
            #app, #cheat-warning { display: none !important; }
            #print-area { display: block !important; padding: 0; margin: 0; }
            
            .print-header { border-bottom: 2px solid black; padding-bottom: 5px; margin-bottom: 8px; text-align: center; }
            .print-header h1 { margin: 0 0 3px 0; font-size: 13pt; font-weight: bold; }
            .print-info { display: flex; justify-content: space-between; font-size: 9pt; font-weight: bold; margin-bottom: 3px;}
            
            /* COMPRESIÓN MÁXIMA: 2 Columnas para asegurar 1 página */
            .print-questions-grid { column-count: 2; column-gap: 15px; }
            
            .print-q { break-inside: avoid; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px dashed #ccc; }
            .print-q-text { font-weight: bold; margin-bottom: 2px; font-size: 9pt !important; line-height: 1.1; }
            
            /* Estilo Blanco (Problemario) */
            body.print-blank .ans-graded { display: none; }
            body.print-blank .print-opt { margin-left: 5px; font-size: 8.5pt !important; line-height: 1.1; display: inline-block; width: 100%; }
            
            /* Estilo Calificado */
            body.print-graded .ans-blank, body.print-graded .print-opt { display: none; }
            body.print-graded .ans-graded { display: block; margin-top: 1px; font-size: 8.5pt !important; line-height: 1.1; margin-left: 10px;}
            .ans-graded.correct { color: green; font-weight: bold; }
            .ans-graded.wrong { color: red; text-decoration: line-through; }
        }
    </style>
</head>
<body>

    <div id="cheat-warning">
        <h1>⚠️ ALERTA ANTITRAMPA ⚠️</h1>
        <p>Has abandonado la ventana del examen.</p>
        <p>Regresa en <span id="cheat-timer" style="font-size:36px;">5</span> segundos o la prueba será ANULADA.</p>
    </div>

    <div id="app">
        <div id="screen-login" class="screen active">
            <div class="login-box">
                <h2 style="color: var(--kahoot-purple); margin-top:0;">Evaluación: Codificación CSS</h2>
                <p>20 Reactivos de nivel técnico.<br><b style="color:red;">Advertencia:</b> Salir de la ventana anulará tu evaluación.</p>
                <input type="text" id="student-name" placeholder="Escribe tu Nombre Completo" autocomplete="off">
                <button class="btn-main" onclick="startExam()">COMENZAR EXAMEN</button>
                <button class="btn-secondary" onclick="printBlank()">🖨️ Imprimir Problemario (En Blanco)</button>
            </div>
        </div>

        <div id="screen-quiz" class="screen">
            <div class="header">
                <span id="display-name">Alumno: </span>
                <span id="display-progress">Pregunta: 1/20</span>
            </div>
            <div class="question-box" id="question-text"></div>
            <div class="options-grid" id="options-container"></div>
        </div>

        <div id="screen-results" class="screen">
            <div class="login-box">
                <h2>Examen Finalizado</h2>
                <h1 id="final-score" style="color: var(--blue); font-size: 48px; margin: 10px 0;">0 / 20</h1>
                <p id="time-summary"></p>
                <button class="btn-main" style="background: var(--green);" onclick="printGraded()">🖨️ Generar PDF Calificado</button>
            </div>
        </div>
    </div>

    <div id="print-area"></div>

    <script>
        // ================= BASE DE DATOS: 20 PREGUNTAS (DISTRACTORES SIMÉTRICOS EN LONGITUD) =================
        const db = [
            { q: "¿Qué significa la sigla CSS en desarrollo web?", 
              r: "Cascading Style Sheets.", d: ["Computing Style System.", "Creative Styling Sheets", "Color System Structures"] },
            { q: "¿Qué propiedad en CSS cambia el color del texto?", 
              r: "La propiedad es color.", d: ["La propiedad font-col.", "La propiedad text-clr.", "La propiedad font-ink."] },
            { q: "¿Cómo se selecciona un elemento con el id 'header'?", 
              r: "Usando el símbolo hashtag: #header.", d: ["Usando un punto inicial: .header.", "Usando la etiqueta base: header_.", "Usando el signo de dólar: $header."] },
            { q: "¿Qué propiedad controla el tamaño de la fuente tipográfica?", 
              r: "font-size define el tamaño del texto.", d: ["text-size ajusta la escala del texto.", "font-scale altera la medida de letra.", "text-scale cambia la medida del texto."] },
            { q: "¿Cuál es el valor por defecto de la propiedad 'position'?", 
              r: "El valor predeterminado es static.", d: ["La opción predefinida es relative.", "El estado por omisión es absolute.", "El formato original es un inherits."] },
            { q: "¿Qué hace la regla 'display: none;' en un elemento?", 
              r: "Oculta el elemento de la vista y del DOM.", d: ["Cambia la opacidad de la caja al mínimo.", "Reduce el tamaño del contenedor al 0%.", "Vuelve invisible el fondo del elemento."] },
            { q: "¿Cómo se añade un color de fondo a un contenedor 'div'?", 
              r: "Usando la regla background-color.", d: ["Con la propiedad color-of-backgr.", "Mediante la etiqueta box-bg-color.", "A través de la regla bg-fill-color."] },
            { q: "¿Qué unidad de medida en CSS es siempre relativa?", 
              r: "La unidad 'em' es relativa a su padre.", d: ["La unidad 'px' es variable en el DOM.", "La unidad 'pt' depende del contenedor.", "La unidad 'cm' se adapta a los padres."] },
            { q: "¿Cuál es la sintaxis correcta para un comentario en CSS?", 
              r: "/* Este es un comentario válido */", d: ["// Este es un comentario lineal //", "", "** Este es un comentario oculto **"] },
            { q: "¿Qué propiedad establece el espacio interior de un elemento?", 
              r: "Padding ajusta el relleno interno.", d: ["Margins define el margen exterior.", "Spacing cambia la brecha exterior.", "Borders modifica el borde externo."] },
            { q: "¿Qué hace la propiedad 'z-index' en elementos posicionados?", 
              r: "Controla el apilamiento en el eje Z.", d: ["Define el acercamiento en el eje Y.", "Ajusta el desplazamiento en la red.", "Regula la perspectiva del nodo DOM."] },
            { q: "¿Cómo aplicar correctamente un borde sólido rojo de 1px?", 
              r: "border: 1px solid red;", d: ["outline: 1px red solid;", "line: solid 1px red_c;", "box-line: red 1px sol;"] },
            { q: "¿Cuál selector CSS afecta a todos los elementos del DOM?", 
              r: "El asterisco (*) selecciona todos.", d: ["La palabra (all) afecta todo el dom.", "El signo (&) modifica a cada nodo.", "El comodín (%) selecciona al total."] },
            { q: "¿Qué define la propiedad 'justify-content' en Flexbox?", 
              r: "Alinea los ítems en el eje principal.", d: ["Centra las cajas en el eje cruzado.", "Ajusta los nodos en el eje vertical.", "Mueve las líneas al borde del flex."] },
            { q: "¿Cómo se llama el modelo estructural de diseño en CSS?", 
              r: "Es conocido como el CSS Box Model.", d: ["Se denomina como Block Layout CSS.", "Es llamado el CSS Container Grid.", "Se identifica como CSS Box Frame."] },
            { q: "¿Qué indica exactamente la pseudo-clase estática ':hover'?", 
              r: "Estilos cuando el cursor pasa encima.", d: ["Reglas cuando el enlace ya se pulsó.", "Formato cuando el elemento se carga.", "Cambios cuando el nodo recibe focos."] },
            { q: "¿Cómo hacer que un texto se renderice en formato negrita?", 
              r: "Utilizando font-weight: bold;", d: ["Mediante el text-style: bold;", "Aplicando font-format: thick;", "Escribiendo text-weight: max;"] },
            { q: "¿Qué propiedad transforma el texto a letras mayúsculas?", 
              r: "La propiedad text-transform hace esto.", d: ["La directiva font-uppercase es usada.", "El atributo text-case puede lograrlo.", "El selector font-capitalize es útil."] },
            { q: "¿Cómo establecer que un texto fluya en múltiples columnas?", 
              r: "column-count define el número deseado.", d: ["text-columns indica las cajas a usar.", "grid-columns divide el área del texto.", "split-column fracciona los párrafos."] },
            { q: "¿Qué propiedad hace que una caja completa sea transparente?", 
              r: "opacity controla la transparencia real.", d: ["visible ajusta el ocultamiento visual.", "display cambia la opacidad de la capa.", "alpha-filter difumina todo el relleno."] }
        ];

        // ================= VARIABLES GLOBALES =================
        let studentName = "";
        let currentQ = 0;
        let score = 0;
        let startTime, endTime;
        let userAnswers = [];
        let examActive = false;
        
        // Anti-Trampas
        let isCheater = false;
        let cheatInterval;
        let timeRemaining = 5;

        // ================= LÓGICA ANTITRAMPAS =================
        document.addEventListener("visibilitychange", () => {
            if (!examActive || isCheater) return;
            const warningEl = document.getElementById('cheat-warning');

            if (document.hidden) {
                // Salió de la pestaña
                timeRemaining = 5;
                document.getElementById('cheat-timer').innerText = timeRemaining;
                warningEl.style.display = 'flex';
                
                cheatInterval = setInterval(() => {
                    timeRemaining--;
                    document.getElementById('cheat-timer').innerText = timeRemaining;
                    if (timeRemaining <= 0) {
                        clearInterval(cheatInterval);
                        lockExam();
                    }
                }, 1000);
            } else {
                // Volvió a tiempo
                clearInterval(cheatInterval);
                if (!isCheater) {
                    warningEl.style.display = 'none';
                }
            }
        });

        function lockExam() {
            isCheater = true;
            examActive = false;
            document.getElementById('cheat-warning').innerHTML = `
                <h1>❌ EXAMEN ANULADO ❌</h1>
                <p>Abandonaste la evaluación por más de 5 segundos.</p>
                <button class="btn-main" style="margin-top:20px; width:250px;" onclick="finishExam(true)">Ver Reporte</button>
            `;
        }

        // ================= LÓGICA DEL EXAMEN =================
        function startExam() {
            studentName = document.getElementById("student-name").value.trim().toUpperCase();
            if (studentName === "") { alert("Ingresa tu Nombre Completo para iniciar."); return; }

            const localKey = "css_exam_" + studentName.replace(/\s/g, '');
            if (localStorage.getItem(localKey)) {
                alert("Ya registras un intento previo en esta computadora. El examen no se puede repetir.");
                return;
            }
            localStorage.setItem(localKey, "iniciado");
            
            examActive = true;
            startTime = new Date();
            
            document.getElementById("display-name").innerText = "Alumno: " + studentName;
            document.getElementById("screen-login").classList.remove("active");
            document.getElementById("screen-quiz").classList.add("active");

            loadQuestion();
        }

        function loadQuestion() {
            const q = db[currentQ];
            document.getElementById("display-progress").innerText = `Pregunta: ${currentQ + 1} / 20`;
            document.getElementById("question-text").innerText = q.q;

            let options = [...q.d, q.r].sort(() => 0.5 - Math.random());
            const container = document.getElementById("options-container");
            container.innerHTML = "";

            options.forEach((opt, index) => {
                const btn = document.createElement("button");
                btn.className = `option-btn opt-${index}`;
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(opt, btn, q.r);
                container.appendChild(btn);
            });
        }

        function selectAnswer(selectedText, btnElement, correctText) {
            // Bloquea los demás botones para no repetir clic
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            userAnswers.push(selectedText);

            if (selectedText === correctText) {
                score++;
                btnElement.style.filter = "brightness(1.5) drop-shadow(0 0 10px white)";
            } else {
                btnElement.style.filter = "brightness(0.5)";
                allBtns.forEach(b => {
                    if (b.innerText === correctText) {
                         b.style.filter = "brightness(1.5) drop-shadow(0 0 10px white)";
                    }
                });
            }

            setTimeout(() => {
                currentQ++;
                if (currentQ < db.length && !isCheater) {
                    loadQuestion();
                } else {
                    finishExam(false);
                }
            }, 1200); // 1.2s de pausa
        }

        function formatTime(date) { 
            if(!date) return "--:--";
            return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}); 
        }

        function finishExam(dueToCheat) {
            examActive = false;
            endTime = new Date();
            
            const localKey = "css_exam_" + studentName.replace(/\s/g, '');
            localStorage.setItem(localKey, `score:${score}_cheat:${dueToCheat}`);

            document.getElementById("cheat-warning").style.display = "none";
            document.getElementById("screen-quiz").classList.remove("active");
            document.getElementById("screen-results").classList.add("active");

            document.getElementById("final-score").innerText = dueToCheat ? "ANULADO" : `${score} / 20`;
            document.getElementById("time-summary").innerHTML = `
                <strong>Inicio:</strong> ${formatTime(startTime)} <br>
                <strong>Término:</strong> ${formatTime(endTime)}
            `;
        }

        // ================= LÓGICA DE IMPRESIÓN (MÁXIMO 1 HOJA) =================
        function printBlank() {
            let tempName = document.getElementById("student-name").value.trim().toUpperCase() || "____________________________________";
            document.body.className = 'print-blank'; 
            buildPrintHTML(tempName, false, true);
            window.print();
        }

        function printGraded() {
            document.body.className = 'print-graded'; 
            buildPrintHTML(studentName, isCheater, false);
            window.print();
        }

        function buildPrintHTML(name, dueToCheat, isBlank) {
            const printArea = document.getElementById("print-area");
            
            let html = `
                <div class="print-header">
                    <h1>Problemario: Codificación CSS</h1>
                    <div class="print-info">
                        <span>Alumno: ${name}</span>
                        <span>Aciertos: ${isBlank ? '___ / 20' : (dueToCheat ? '0 (TRAMPA)' : score + ' / 20')}</span>
                    </div>
                    <div class="print-info" style="font-weight:normal;">
                        <span>Inicio: ${isBlank ? '__:__:__' : formatTime(startTime)}</span>
                        <span>Término: ${isBlank ? '__:__:__' : formatTime(endTime)}</span>
                    </div>
                </div>
                <div class="print-questions-grid">
            `;

            db.forEach((q, index) => {
                html += `<div class="print-q">`;
                html += `<div class="print-q-text">${index + 1}. ${q.q}</div>`;
                
                // Modo Blanco (Problemario)
                if (isBlank) {
                    let opts = [...q.d, q.r].sort(() => 0.5 - Math.random());
                    opts.forEach(o => {
                        html += `<div class="print-opt">( ) ${o}</div>`;
                    });
                } else {
                    // Modo Calificado
                    const uAns = userAnswers[index] || "Sin responder";
                    if (uAns === q.r) {
                        html += `<div class="ans-graded correct">[ ✔ ] ${q.r}</div>`;
                    } else {
                        html += `<div class="ans-graded wrong">[ ✘ ] Respuesta: ${uAns}</div>`;
                        html += `<div class="ans-graded correct">Correcta: ${q.r}</div>`;
                    }
                }
                
                html += `</div>`;
            });

            html += `</div>`;
            printArea.innerHTML = html;
        }
    </script>
</body>
</html>
