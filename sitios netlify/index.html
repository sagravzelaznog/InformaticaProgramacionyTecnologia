      "title": "fix: Corregir problema de crecimiento infinito en gráficos del Módulo 1\n\n- Arreglado el canvas del gráfico de conceptos básicos que no dejaba de crecer\n- Añadido límites fijos (min/max) a los ejes X e Y para evitar escalado infinito\n- Desactivada la animación de Chart.js (duration: 0) para evitar redibujado continuo\n- Separadas las variables de gráficos (currentChart, elementaryChart, transformationChart)\n- Añadida verificación de existencia de canvas antes de inicializar\n- Implementada destrucción correcta de gráficos anteriores antes de crear nuevos\n- Añadida variable 'initialized' para evitar múltiples inicializaciones\n- Mejorada la configuración de los ejes con posición 'bottom' y 'left' en lugar de 'center'\n- Añadidos estilos de grid y tooltip para mejor visualización\n- Optimizado el renderizado con pointRadius: 0 para no mostrar puntos individuales",

        // Función para formatear la fecha
        function formatDate(dateString) {
            const options = { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            return new Date(dateString).toLocaleDateString('es-ES', options);
        }

        // Función para renderizar los sitios
        function renderSites(sitesToRender) {
            const container = document.getElementById('sitesContainer');
            container.innerHTML = '';

            if (sitesToRender.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-inbox fa-4x text-muted mb-3"></i>
                        <h4>No se encontraron sitios</h4>
                        <p class="text-muted">Intenta con otros términos de búsqueda o filtros</p>
                    </div>
                `;
                return;
            }

            sitesToRender.forEach(site => {
                const siteCard = document.createElement('div');
                siteCard.className = 'col-12 col-md-6 col-lg-4 col-xl-3';
                
                const statusClass = site.state === 'current' ? 'success' : 'secondary';
                const statusText = site.state === 'current' ? 'Activo' : 'Inactivo';
                
                siteCard.innerHTML = `
                    <div class="card site-card h-100">
                        <div class="screenshot-container">
                            ${site.screenshot_url ? 
                                `<img src="${site.screenshot_url}" class="screenshot" alt="Captura de ${site.name}">` : 
                                '<div class="no-screenshot w-100 text-center">Sin captura disponible</div>'
                            }
                        </div>
                        <div class="card-body site-info">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="card-title mb-0">${site.name}</h5>
                                <span class="badge bg-${statusClass}">${statusText}</span>
                            </div>
                            
                            <div class="mb-2">
                                <span class="info-label">URL:</span>
                                <a href="${site.ssl_url || site.url}" target="_blank" class="site-url d-block text-truncate" title="${site.ssl_url || site.url}">
                                    ${(site.ssl_url || site.url).replace(/^https?:\/\//, '')}
                                </a>
                            </div>
                            
                            ${site.repo_url ? `
                            <div class="mb-2">
                                <span class="info-label">Repositorio:</span>
                                <a href="${site.repo_url}" target="_blank" class="d-block text-truncate" title="${site.repo_url}">
                                    ${site.repo_url.replace(/^https?:\/\//, '').replace('github.com/', '')}
                                </a>
                            </div>` : ''}
                            
                            <div class="mb-2">
                                <span class="info-label">Creado:</span>
                                <span>${formatDate(site.created_at)}</span>
                            </div>
                            
                            <div class="last-updated mb-3">
                                <i class="far fa-clock me-1"></i>
                                Actualizado: ${formatDate(site.updated_at)}
                            </div>
                            
                            <div class="site-actions">
                                <a href="${site.ssl_url || site.url}" target="_blank" class="btn btn-primary btn-sm flex-grow-1">
                                    <i class="fas fa-external-link-alt me-1"></i> Ver sitio
                                </a>
                                ${site.admin_url ? `
                                <a href="${site.admin_url}" target="_blank" class="btn btn-outline-secondary btn-sm" title="Abrir en Netlify">
                                    <i class="fas fa-cog"></i>
                                </a>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                
                container.appendChild(siteCard);
            });
        }

        // Función para filtrar y ordenar sitios
        function filterAndSortSites() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
            let filteredSites = [...sites];
            
            // Aplicar filtro de búsqueda
            if (searchTerm) {
                filteredSites = filteredSites.filter(site => 
                    site.name.toLowerCase().includes(searchTerm) || 
                    (site.url && site.url.toLowerCase().includes(searchTerm)) ||
                    (site.repo_url && site.repo_url.toLowerCase().includes(searchTerm))
                );
            }
            
            // Aplicar filtro de estado
            if (statusFilter) {
                filteredSites = filteredSites.filter(site => site.state === statusFilter);
            }
            
            // Ordenar por fecha de actualización (más reciente primero)
            filteredSites.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            
            renderSites(filteredSites);
        }

        // Inicializar la página
        document.addEventListener('DOMContentLoaded', () => {
            // Mostrar todos los sitios inicialmente
            renderSites([...sites]);
            
            // Configurar eventos
            document.getElementById('searchInput').addEventListener('input', filterAndSortSites);
            document.getElementById('statusFilter').addEventListener('change', filterAndSortSites);
            
            // Configurar ordenamiento por fecha
            let sortAscending = false;
            document.getElementById('sortDate').addEventListener('click', () => {
                sortAscending = !sortAscending;
                const button = document.getElementById('sortDate');
                button.innerHTML = sortAscending ? 
                    '<i class="fas fa-sort-amount-down"></i> Más antiguos primero' : 
                    '<i class="fas fa-sort-amount-up"></i> Más recientes primero';
                
                const filteredSites = [...document.querySelectorAll('.site-card')].map(card => {
                    const siteName = card.querySelector('.card-title').textContent;
                    return sites.find(site => site.name === siteName);
                });
                
                filteredSites.sort((a, b) => {
                    return sortAscending ? 
                        new Date(a.updated_at) - new Date(b.updated_at) : 
                        new Date(b.updated_at) - new Date(a.updated_at);
                });
                
                renderSites(filteredSites);
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
