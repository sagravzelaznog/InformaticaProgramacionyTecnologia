<svg width="200mm" height="100mm" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Base horizontal -->
  <rect x="10" y="80" width="180" height="10" fill="black" />

  <!-- Ranuras verticales tipo peine -->
  <g fill="black">
    <!-- Cada ranura tiene 2mm de ancho y 20mm de alto -->
    <!-- Espaciado de 10mm entre ranuras -->
    <rect x="20" y="60" width="2" height="20" />
    <rect x="30" y="60" width="2" height="20" />
    <rect x="40" y="60" width="2" height="20" />
    <rect x="50" y="60" width="2" height="20" />
    <rect x="60" y="60" width="2" height="20" />
    <rect x="70" y="60" width="2" height="20" />
    <rect x="80" y="60" width="2" height="20" />
    <rect x="90" y="60" width="2" height="20" />
    <rect x="100" y="60" width="2" height="20" />
    <rect x="110" y="60" width="2" height="20" />
    <rect x="120" y="60" width="2" height="20" />
    <rect x="130" y="60" width="2" height="20" />
    <rect x="140" y="60" width="2" height="20" />
    <rect x="150" y="60" width="2" height="20" />
    <rect x="160" y="60" width="2" height="20" />
    <rect x="170" y="60" width="2" height="20" />
  </g>

  <!-- Placas de madera simuladas -->
  <g fill="#8B4513">
    <rect x="22" y="30" width="2" height="30" />
    <rect x="42" y="20" width="2" height="40" />
    <rect x="62" y="35" width="2" height="25" />
    <rect x="82" y="25" width="2" height="35" />
    <rect x="102" y="30" width="2" height="30" />
    <rect x="122" y="20" width="2" height="40" />
    <rect x="142" y="35" width="2" height="25" />
    <rect x="162" y="25" width="2" height="35" />
  </g>
</svg>