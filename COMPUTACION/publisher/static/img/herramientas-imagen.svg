<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- Barra de título -->
    <rect x="0" y="0" width="100%" height="40" fill="#2b579a"/>
    <text x="20" y="25" font-family="Arial" font-size="14" fill="white">Herramientas de imagen en Publisher</text>
    
    <!-- Barra de herramientas de imagen -->
    <rect x="0" y="40" width="100%" height="80" fill="#f3f3f3" stroke="#ddd" stroke-width="1"/>
    
    <!-- Pestaña de herramientas de imagen -->
    <rect x="20" y="40" width="120" height="30" fill="white" stroke="#ddd" stroke-width="1" stroke-bottom="none"/>
    <text x="80" y="60" font-family="Arial" font-size="12" text-anchor="middle">Formato</text>
    
    <!-- Grupo de herramientas -->
    <g font-family="Arial" font-size="11">
        <!-- Recortar -->
        <rect x="30" y="90" width="80" height="25" rx="3" fill="#e6f2ff" stroke="#4d94ff"/>
        <text x="70" y="108" text-anchor="middle">✂️ Recortar</text>
        
        <!-- Girar -->
        <rect x="130" y="90" width="70" height="25" rx="3" fill="white" stroke="#ddd"/>
        <text x="165" y="108" text-anchor="middle">🔄 Girar</text>
        
        <!-- Correcciones -->
        <rect x="220" y="90" width="90" height="25" rx="3" fill="white" stroke="#ddd"/>
        <text x="265" y="108" text-anchor="middle">🎨 Correcciones</text>
        
        <!-- Efectos artísticos -->
        <rect x="330" y="90" width="120" height="25" rx="3" fill="white" stroke="#ddd"/>
        <text x="390" y="108" text-anchor="middle">🎭 Efectos artísticos</text>
    </g>
    
    <!-- Área de trabajo -->
    <rect x="50" y="140" width="500" height="200" fill="white" stroke="#ddd" rx="4"/>
    
    <!-- Imagen de ejemplo -->
    <rect x="100" y="160" width="200" height="160" fill="#e1f5fe" stroke="#4fc3f7" stroke-width="1" rx="2"/>
    <text x="200" y="240" font-family="Arial" font-size="14" text-anchor="middle" fill="#01579b">Imagen original</text>
    
    <!-- Panel de ajustes -->
    <rect x="350" y="160" width="180" height="160" fill="#f8f9ff" stroke="#ddd" rx="4"/>
    <text x="440" y="180" font-family="Arial" font-size="12" text-anchor="middle" font-weight="bold">Ajustes de imagen</text>
    
    <!-- Controles deslizantes -->
    <g font-family="Arial" font-size="10">
        <!-- Brillo -->
        <text x="360" y="210">Brillo</text>
        <rect x="410" y="200" width="100" height="10" fill="#e0e0e0" rx="5"/>
        <rect x="410" y="200" width="70" height="10" fill="#4fc3f7" rx="5"/>
        <circle cx="480" cy="205" r="8" fill="#0078d7"/>
        
        <!-- Contraste -->
        <text x="360" y="240">Contraste</text>
        <rect x="410" y="230" width="100" height="10" fill="#e0e0e0" rx="5"/>
        <rect x="430" y="230" width="80" height="10" fill="#4fc3f7" rx="5"/>
        <circle cx="510" cy="235" r="8" fill="#0078d7"/>
        
        <!-- Nitidez -->
        <text x="360" y="270">Nitidez</text>
        <rect x="410" y="260" width="100" height="10" fill="#e0e0e0" rx="5"/>
        <rect x="420" y="260" width="60" height="10" fill="#4fc3f7" rx="5"/>
        <circle cx="480" cy="265" r="8" fill="#0078d7"/>
    </g>
    
    <!-- Botones de acción -->
    <rect x="400" y="340" width="80" height="30" rx="4" fill="#0078d7"/>
    <text x="440" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Aplicar</text>
    
    <rect x="490" y="340" width="60" height="30" rx="4" fill="#f1f1f1" stroke="#ddd" stroke-width="1"/>
    <text x="520" y="360" font-family="Arial" font-size="12" text-anchor="middle">Cancelar</text>
    
    <!-- Indicador -->
    <g transform="translate(50, 310)">
        <circle cx="15" cy="15" r="12" fill="#ffeb3b" stroke="#ffc107" stroke-width="2"/>
        <text x="15" y="20" font-family="Arial" font-size="12" text-anchor="middle">i</text>
        <text x="35" y="20" font-family="Arial" font-size="10">Ajusta la imagen según tus necesidades</text>
    </g>
</svg>
