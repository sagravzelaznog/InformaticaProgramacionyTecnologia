<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- Título -->
    <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Trabajo con texto en Publisher</text>
    
    <!-- Ejemplo de texto formateado -->
    <g transform="translate(50, 70)">
        <!-- Cuadro de texto -->
        <rect x="0" y="0" width="500" height="300" fill="white" stroke="#0078d7" stroke-width="2" rx="5"/>
        
        <!-- Barra de herramientas de formato -->
        <rect x="10" y="10" width="480" height="40" fill="#f1f1f1" rx="2"/>
        
        <!-- Opciones de fuente -->
        <rect x="20" y="20" width="100" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="25" y="35" font-family="Arial" font-size="12">Arial</text>
        <polygon points="110,25 115,30 105,30" fill="#666"/>
        
        <!-- Tamaño de fuente -->
        <rect x="130" y="20" width="40" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="135" y="35" font-family="Arial" font-size="12">12</text>
        <polygon points="170,25 175,30 165,30" fill="#666"/>
        
        <!-- Botones de formato -->
        <rect x="190" y="20" width="24" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="200" y="35" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle">B</text>
        
        <rect x="220" y="20" width="24" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="230" y="35" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle">I</text>
        
        <rect x="250" y="20" width="24" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="260" y="35" font-family="Arial" font-size="12" text-decoration="underline" text-anchor="middle">S</text>
        
        <!-- Alineación -->
        <rect x="350" y="20" width="24" height="20" fill="#e6f2ff" stroke="#4d94ff" rx="2"/>
        <text x="362" y="35" font-family="Arial" font-size="12" text-anchor="middle">¶</text>
        
        <rect x="380" y="20" width="24" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="392" y="35" font-family="Arial" font-size="12" text-anchor="middle">¶</text>
        
        <rect x="410" y="20" width="24" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="422" y="35" font-family="Arial" font-size="12" text-anchor="middle">¶</text>
        
        <!-- Área de texto de ejemplo -->
        <rect x="30" y="70" width="440" height="200" fill="white" stroke="#eee" rx="2"/>
        
        <!-- Título de ejemplo -->
        <text x="40" y="95" font-family="Arial" font-size="20" font-weight="bold">Título Principal</text>
        
        <!-- Subtítulo -->
        <text x="40" y="125" font-family="Arial" font-size="16" font-style="italic">Subtítulo informativo</text>
        
        <!-- Párrafo de ejemplo -->
        <text x="40" y="155" font-family="Arial" font-size="12">Este es un ejemplo de texto formateado en </text>
        <text x="40" y="175" font-family="Arial" font-size="12">Microsoft Publisher. Puedes cambiar la fuente,</text>
        <text x="40" y="195" font-family="Arial" font-size="12">tamaño, color y estilo del texto según tus</text>
        <text x="40" y="215" font-family="Arial" font-size="12">necesidades de diseño.</text>
        
        <!-- Texto en negrita -->
        <text x="40" y="245" font-family="Arial" font-size="12" font-weight="bold">Texto en negrita</text>
        
        <!-- Texto en cursiva -->
        <text x="150" y="245" font-family="Arial" font-size="12" font-style="italic">Texto en cursiva</text>
        
        <!-- Texto subrayado -->
        <text x="260" y="245" font-family="Arial" font-size="12" text-decoration="underline">Texto subrayado</text>
    </g>
    
    <!-- Indicador de herramientas -->
    <g transform="translate(400, 320)">
        <circle cx="50" cy="20" r="15" fill="#ffeb3b" stroke="#ffc107" stroke-width="2"/>
        <text x="50" y="25" font-family="Arial" font-size="12" text-anchor="middle">i</text>
        <text x="70" y="25" font-family="Arial" font-size="12">Usa la pestaña Inicio para formato de texto</text>
    </g>
</svg>
