<svg width="500" height="250" viewBox="0 0 500 250" xmlns="http://www.w3.org/2000/svg">
    <!-- Barra de título -->
    <rect x="10" y="10" width="480" height="30" fill="#0078d7" rx="2"/>
    <text x="20" y="30" font-family="Arial" font-size="14" fill="white">Microsoft Publisher - [Nombre del documento]</text>
    
    <!-- Cinta de opciones -->
    <rect x="10" y="50" width="480" height="40" fill="#f2f2f2" rx="2"/>
    <rect x="20" y="60" width="50" height="20" fill="#e0e0e0" rx="2"/>
    <rect x="80" y="60" width="50" height="20" fill="#e0e0e0" rx="2"/>
    <rect x="140" y="60" width="50" height="20" fill="#e0e0e0" rx="2"/>
    
    <!-- Barra de herramientas de acceso rápido -->
    <rect x="10" y="100" width="40" height="140" fill="#f8f8f8" rx="2"/>
    <rect x="15" y="110" width="30" height="30" fill="#e0e0e0" rx="2"/>
    <rect x="15" y="150" width="30" height="30" fill="#e0e0e0" rx="2"/>
    
    <!-- Panel de navegación -->
    <rect x="60" y="110" width="80" height="120" fill="#e0e0e0" rx="2"/>
    <text x="70" y="130" font-family="Arial" font-size="12">Panel de</text>
    <text x="70" y="150" font-family="Arial" font-size="12">navegación</text>
    
    <!-- Área de trabajo -->
    <rect x="150" y="110" width="390" height="120" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
    <text x="160" y="130" font-family="Arial" font-size="12">Área de trabajo principal</text>
    
    <!-- Título -->
    <text x="250" y="50" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Interfaz de Publisher</text>
</svg>
