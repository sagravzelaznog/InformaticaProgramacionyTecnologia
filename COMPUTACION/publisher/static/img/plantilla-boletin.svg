<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo del boletín -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- Hoja del boletín -->
    <rect x="30" y="15" width="140" height="120" fill="white" stroke="#28a745" stroke-width="1" rx="2"/>
    
    <!-- Encabezado -->
    <rect x="30" y="15" width="140" height="20" fill="#28a745" fill-opacity="0.9"/>
    <text x="100" y="30" font-family="Arial" font-size="10" fill="white" text-anchor="middle">BOLETÍN INFORMATIVO</text>
    
    <!-- Fecha y número -->
    <rect x="35" y="40" width="60" height="8" fill="#e9ecef" rx="1"/>
    <rect x="115" y="40" width="50" height="8" fill="#e9ecef" rx="1"/>
    
    <!-- Título principal -->
    <rect x="35" y="55" width="130" height="10" fill="#e9ecef" rx="1"/>
    
    <!-- Columnas -->
    <rect x="35" y="70" width="60" height="55" fill="#e8f5e9" rx="1"/>
    <rect x="105" y="70" width="60" height="55" fill="#e8f5e9" rx="1"/>
    
    <!-- Línea divisoria -->
    <line x1="100" y1="70" x2="100" y2="125" stroke="#c3e6cb" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Texto de ejemplo -->
    <rect x="40" y="75" width="50" height="5" fill="#28a745" fill-opacity="0.3" rx="1"/>
    <rect x="40" y="85" width="50" height="2" fill="#28a745" fill-opacity="0.2" rx="1"/>
    <rect x="40" y="90" width="50" height="2" fill="#28a745" fill-opacity="0.2" rx="1"/>
    
    <rect x="110" y="75" width="50" height="5" fill="#28a745" fill-opacity="0.3" rx="1"/>
    <rect x="110" y="85" width="50" height="2" fill="#28a745" fill-opacity="0.2" rx="1"/>
    
    <!-- Pie de página -->
    <rect x="40" y="105" width="120" height="2" fill="#28a745" fill-opacity="0.2"/>
    <rect x="40" y="115" width="50" height="2" fill="#28a745" fill-opacity="0.2" rx="1"/>
    
    <!-- Ícono de boletín -->
    <rect x="80" y="130" width="40" height="15" fill="#28a745" rx="2"/>
    <text x="100" y="141" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Boletín</text>
</svg>
