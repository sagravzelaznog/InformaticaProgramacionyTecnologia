<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo del folleto -->
    <rect x="50" y="50" width="400" height="200" fill="#f0f8ff" stroke="#87ceeb" stroke-width="2" rx="5"/>
    
    <!-- Barra de menú -->
    <rect x="70" y="80" width="360" height="30" fill="#4682b4" rx="2"/>
    <text x="80" y="102" font-family="Arial" font-size="14" fill="white">Archivo Inicio Insertar Diseño de página Revisar Vista</text>
    
    <!-- Título del folleto -->
    <text x="250" y="140" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Mi Primer Folleto</text>
    
    <!-- Contenido de ejemplo -->
    <text x="100" y="170" font-family="Arial" font-size="14">Bienvenido a Microsoft Publisher</text>
    <text x="100" y="190" font-family="Arial" font-size="12">Crea publicaciones profesionales de manera sencilla</text>
    
    <!-- Imagen de ejemplo -->
    <rect x="300" y="150" width="100" height="80" fill="#e0e0e0" rx="2"/>
    <text x="350" y="190" font-family="Arial" font-size="10" text-anchor="middle">Imagen</text>
    
    <!-- Pie de página -->
    <line x1="70" y1="230" x2="430" y2="230" stroke="#87ceeb" stroke-width="1" stroke-dasharray="5,5"/>
    <text x="250" y="250" font-family="Arial" font-size="10" text-anchor="middle" fill="#666">www.tusitio.com | contacto@tusitio.com</text>
</svg>
