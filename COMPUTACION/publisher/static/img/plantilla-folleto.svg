<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo del folleto -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- Folleto plegado -->
    <rect x="20" y="20" width="160" height="110" fill="white" stroke="#0078d7" stroke-width="1" rx="2"/>
    
    <!-- Portada -->
    <rect x="20" y="20" width="80" height="110" fill="#0078d7" fill-opacity="0.8"/>
    <text x="60" y="40" font-family="Arial" font-size="12" fill="white" text-anchor="middle">PORTA</text>
    <text x="60" y="55" font-family="Arial" font-size="12" fill="white" text-anchor="middle">DA</text>
    
    <!-- Páginas internas -->
    <rect x="100" y="20" width="80" height="55" fill="#f8f9fa" stroke="#dee2e6" stroke-width="0.5"/>
    <rect x="100" y="75" width="80" height="55" fill="#f8f9fa" stroke="#dee2e6" stroke-width="0.5"/>
    
    <!-- Texto de ejemplo -->
    <text x="110" y="35" font-family="Arial" font-size="8" fill="#212529">Título del folleto</text>
    <line x1="110" y1="40" x2="170" y2="40" stroke="#dee2e6" stroke-width="1"/>
    <text x="110" y="55" font-family="Arial" font-size="6" fill="#495057">Texto descriptivo sobre el tema principal del folleto.</text>
    
    <!-- Indicador de plegado -->
    <line x1="100" y1="20" x2="100" y2="130" stroke="#6c757d" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Etiqueta -->
    <rect x="60" y="140" width="80" height="20" fill="#0078d7" rx="2"/>
    <text x="100" y="153" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Folleto</text>
</svg>
