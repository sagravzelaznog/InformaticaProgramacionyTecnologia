<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- Título -->
    <text x="150" y="30" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle">Opciones de Párrafo</text>
    
    <!-- Grupo de opciones -->
    <g transform="translate(30, 50)">
        <!-- Alineación -->
        <rect x="0" y="0" width="240" height="30" fill="#f1f1f1" rx="3"/>
        <text x="10" y="20" font-family="Arial" font-size="12">Alineación:</text>
        
        <!-- Botones de alineación -->
        <rect x="80" y="5" width="25" height="20" fill="#e6f2ff" stroke="#4d94ff" rx="2"/>
        <text x="92" y="20" font-family="Arial" font-size="12" text-anchor="middle">¶</text>
        
        <rect x="110" y="5" width="25" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="122" y="20" font-family="Arial" font-size="12" text-anchor="middle">¶</text>
        
        <rect x="140" y="5" width="25" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="152" y="20" font-family="Arial" font-size="12" text-anchor="middle">¶</text>
        
        <rect x="170" y="5" width="25" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="182" y="20" font-family="Arial" font-size="12" text-anchor="middle">¶</text>
        
        <!-- Interlineado -->
        <rect x="0" y="40" width="240" height="30" fill="#f1f1f1" rx="3"/>
        <text x="10" y="60" font-family="Arial" font-size="12">Interlineado:</text>
        <rect x="90" y="45" width="100" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="100" y="60" font-family="Arial" font-size="12">1.0</text>
        <polygon points="195,50 205,55 195,60" fill="#666"/>
        
        <!-- Viñetas y numeración -->
        <rect x="0" y="80" width="240" height="30" fill="#f1f1f1" rx="3"/>
        <text x="10" y="100" font-family="Arial" font-size="12">Viñetas:</text>
        <rect x="70" y="85" width="25" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="82" y="100" font-family="Arial" font-size="14" text-anchor="middle">•</text>
        
        <rect x="105" y="85" width="25" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="117" y="100" font-family="Arial" font-size="12" text-anchor="middle">1.</text>
        
        <rect x="140" y="85" width="25" height="20" fill="white" stroke="#ccc" rx="2"/>
        <text x="152" y="100" font-family="Arial" font-size="12" text-anchor="middle">a.</text>
        
        <!-- Ejemplo de párrafo -->
        <rect x="0" y="130" width="240" height="120" fill="white" stroke="#eee" rx="3"/>
        <text x="10" y="150" font-family="Arial" font-size="12">Este es un párrafo de ejemplo que</text>
        <text x="10" y="170" font-family="Arial" font-size="12">demuestra diferentes opciones de</text>
        <text x="10" y="190" font-family="Arial" font-size="12">formato de párrafo en Publisher.</text>
        
        <text x="10" y="220" font-family="Arial" font-size="12" font-weight="bold">• Elemento de lista 1</text>
        <text x="25" y="240" font-family="Arial" font-size="12">   Subtema relacionado</text>
        <text x="10" y="260" font-family="Arial" font-size="12" font-weight="bold">• Elemento de lista 2</text>
    </g>
    
    <!-- Indicador de herramientas -->
    <g transform="translate(50, 270)">
        <circle cx="15" cy="15" r="12" fill="#ffeb3b" stroke="#ffc107" stroke-width="2"/>
        <text x="15" y="20" font-family="Arial" font-size="12" text-anchor="middle">i</text>
        <text x="35" y="20" font-family="Arial" font-size="10">Usa la pestaña Formato de párrafo</text>
    </g>
</svg>
