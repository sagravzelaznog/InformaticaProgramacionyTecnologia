<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- Título -->
    <text x="300" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle">Plantillas de Publisher</text>
    
    <!-- Plantilla 1 -->
    <g transform="translate(50, 70)">
        <rect x="0" y="0" width="150" height="200" fill="white" stroke="#0078d7" stroke-width="2" rx="5"/>
        <rect x="10" y="10" width="130" height="30" fill="#0078d7" rx="2"/>
        <rect x="10" y="50" width="60" height="20" fill="#e0e0e0" rx="1"/>
        <rect x="80" y="50" width="60" height="20" fill="#e0e0e0" rx="1"/>
        <rect x="10" y="80" width="130" height="100" fill="#f0f8ff" rx="1"/>
        <text x="75" y="30" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Folleto</text>
    </g>
    
    <!-- Plantilla 2 -->
    <g transform="translate(225, 70)">
        <rect x="0" y="0" width="150" height="200" fill="white" stroke="#28a745" stroke-width="2" rx="5"/>
        <rect x="10" y="10" width="130" height="30" fill="#28a745" rx="2"/>
        <rect x="10" y="50" width="130" height="30" fill="#e0e0e0" rx="1"/>
        <rect x="10" y="90" width="60" height="20" fill="#e0e0e0" rx="1"/>
        <rect x="80" y="90" width="60" height="20" fill="#e0e0e0" rx="1"/>
        <rect x="10" y="120" width="130" height="60" fill="#e8f5e9" rx="1"/>
        <text x="75" y="30" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Boletín</text>
    </g>
    
    <!-- Plantilla 3 -->
    <g transform="translate(400, 70)">
        <rect x="0" y="0" width="150" height="200" fill="white" stroke="#6f42c1" stroke-width="2" rx="5"/>
        <rect x="10" y="10" width="130" height="30" fill="#6f42c1" rx="2"/>
        <circle cx="75" cy="100" r="50" fill="#f3e5f5" stroke="#e1bee7" stroke-width="2"/>
        <text x="75" y="30" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Tarjeta</text>
    </g>
    
    <!-- Flechas -->
    <line x1="210" y1="170" x2="225" y2="170" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="375" y1="170" x2="400" y2="170" stroke="#6c757d" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="300" y="350" font-family="Arial" font-size="14" text-anchor="middle" fill="#495057">Selecciona una plantilla para comenzar tu publicación</text>
    
    <!-- Icono de búsqueda -->
    <g transform="translate(500, 20)">
        <circle cx="40" cy="20" r="15" fill="none" stroke="#6c757d" stroke-width="2"/>
        <line x1="30" y1="30" x2="20" y2="40" stroke="#6c757d" stroke-width="2"/>
    </g>
</svg>
