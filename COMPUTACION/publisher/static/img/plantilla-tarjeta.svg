<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo de la tarjeta -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- Tarjeta de presentación -->
    <rect x="50" y="20" width="100" height="60" fill="white" stroke="#6f42c1" stroke-width="1" rx="2"/>
    
    <!-- Encabezado de la tarjeta -->
    <rect x="50" y="20" width="100" height="15" fill="#6f42c1" fill-opacity="0.9"/>
    
    <!-- Contenido de la tarjeta -->
    <text x="100" y="35" font-family="Arial" font-size="8" fill="white" text-anchor="middle">EMPRESA</text>
    <text x="100" y="50" font-family="Arial" font-size="10" font-weight="bold" text-anchor="middle" fill="#212529">Nombre Apellido</text>
    <text x="100" y="62" font-family="Arial" font-size="8" text-anchor="middle" fill="#495057">Cargo o Especialidad</text>
    <text x="100" y="72" font-family="Arial" font-size="7" text-anchor="middle" fill="#6c757d">email@ejemplo.com</text>
    
    <!-- Efecto 3D -->
    <rect x="55" y="25" width="90" height="50" fill="none" stroke="#e1bee7" stroke-width="1" rx="1"/>
    
    <!-- Sombra -->
    <rect x="55" y="85" width="90" height="5" fill="#e9ecef" rx="1"/>
    
    <!-- Ícono de tarjeta -->
    <rect x="85" y="105" width="30" height="20" fill="#6f42c1" rx="2"/>
    <rect x="90" y="110" width="20" height="10" fill="white" rx="1"/>
    
    <!-- Etiqueta -->
    <rect x="70" y="130" width="60" height="20" fill="#6f42c1" rx="2"/>
    <text x="100" y="144" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Tarjeta</text>
</svg>
