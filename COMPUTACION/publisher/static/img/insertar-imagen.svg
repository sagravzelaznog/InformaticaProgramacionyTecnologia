<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Fondo -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>
    
    <!-- Barra de título -->
    <rect x="0" y="0" width="100%" height="40" fill="#2b579a"/>
    <text x="20" y="25" font-family="Arial" font-size="14" fill="white">Insertar imagen en Publisher</text>
    
    <!-- Barra de herramientas -->
    <rect x="0" y="40" width="100%" height="60" fill="#f3f3f3" stroke="#ddd" stroke-width="1"/>
    
    <!-- Opciones de inserción -->
    <g font-family="Arial" font-size="12">
        <!-- Imágenes -->
        <rect x="20" y="50" width="120" height="40" rx="4" fill="white" stroke="#0078d7" stroke-width="1.5"/>
        <text x="80" y="70" text-anchor="middle" font-weight="bold">Imágenes</text>
        <text x="80" y="85" text-anchor="middle" font-size="10">Desde este dispositivo</text>
        
        <!-- Imágenes en línea -->
        <rect x="160" y="50" width="140" height="40" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
        <text x="230" y="70" text-anchor="middle">Imágenes en línea</text>
        <text x="230" y="85" text-anchor="middle" font-size="10">Bing, OneDrive, etc.</text>
        
        <!-- Captura -->
        <rect x="320" y="50" width="120" height="40" rx="4" fill="white" stroke="#ddd" stroke-width="1"/>
        <text x="380" y="70" text-anchor="middle">Captura</text>
        <text x="380" y="85" text-anchor="middle" font-size="10">Captura de pantalla</text>
    </g>
    
    <!-- Área de vista previa -->
    <rect x="50" y="120" width="500" height="200" fill="white" stroke="#ddd" stroke-width="1" rx="4"/>
    <text x="300" y="150" font-family="Arial" font-size="14" text-anchor="middle" fill="#666">Vista previa de la imagen seleccionada</text>
    
    <!-- Ejemplo de imagen -->
    <rect x="150" y="160" width="300" height="140" fill="#e1f5fe" stroke="#4fc3f7" stroke-width="1" rx="2"/>
    <text x="300" y="240" font-family="Arial" font-size="14" text-anchor="middle" fill="#01579b">Imagen de ejemplo</text>
    
    <!-- Botones de acción -->
    <rect x="400" y="340" width="80" height="30" rx="4" fill="#0078d7"/>
    <text x="440" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Insertar</text>
    
    <rect x="490" y="340" width="60" height="30" rx="4" fill="#f1f1f1" stroke="#ddd" stroke-width="1"/>
    <text x="520" y="360" font-family="Arial" font-size="12" text-anchor="middle">Cancelar</text>
    
    <!-- Indicador -->
    <g transform="translate(50, 280)">
        <circle cx="15" cy="15" r="12" fill="#ffeb3b" stroke="#ffc107" stroke-width="2"/>
        <text x="15" y="20" font-family="Arial" font-size="12" text-anchor="middle">i</text>
        <text x="35" y="20" font-family="Arial" font-size="10">Selecciona la opción que prefieras</text>
    </g>
</svg>
